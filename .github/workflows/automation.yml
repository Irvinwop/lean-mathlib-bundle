          $hostPath=[Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          & $hostPath -NoLogo -NoProfile -NonInteractive -File "$private/source/tools/round2/server-system-file-surfaces-native.ps1" -PrivateRoot $private *> "$private/report/system-file-surfaces.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/system-file-surfaces.exit",([string]$code+"`n"))
          exit $code
      - name: Test automatic signed component baseline without any capture
        if: always() && !cancelled()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          if(-not $private -or -not [IO.File]::Exists("$private/source-admitted")){throw 'Require the admitted source'}
          $hostPath=[Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          & $hostPath -NoLogo -NoProfile -NonInteractive -File "$private/source/tools/round2/server-manifest-baseline-native.ps1" -PrivateRoot $private *> "$private/report/server-manifest-baseline.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/server-manifest-baseline.exit",([string]$code+"`n"))
          exit $code
      - name: Verify missing and replaced inert Windows path against stock identity
        if: always() && !cancelled()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          if(-not $private -or -not [IO.File]::Exists("$private/source-admitted")){throw 'Require the admitted source'}
          $desktop=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell\v1.0\powershell.exe'
          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tests/Test-WindowsExpectedFile.Native.ps1" -PrivateRoot $private *> "$private/report/expected-file-witness.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/expected-file-witness.exit",([string]$code+"`n"))
