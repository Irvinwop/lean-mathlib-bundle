          }
          [IO.Compression.ZipFile]::CreateFromDirectory("$private/report","$private/failure.zip")
          & 'C:\Program Files\Git\usr\bin\openssl.exe' cms -encrypt -binary -aes-256-gcm -outform DER -in "$private/failure.zip" -out "$private/report.cms.partial" "$private/report.crt" *> "$private/sealing.log"
          if($LASTEXITCODE){throw 'Native failure report encryption failed'}
