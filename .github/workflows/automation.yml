          $probe="$private/source/tools/round2/server-component-authority-native.ps1"
          if(-not [IO.File]::Exists($probe)){exit 0}
          $hostPath=[Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          & $hostPath -NoLogo -NoProfile -NonInteractive -File $probe -PrivateRoot $private *> "$private/report/server-component-authority.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/server-component-authority.exit",([string]$code+"`n"))
          exit $code
      - name: Test Inspect, Apply, ordinary execution and repeat Apply
