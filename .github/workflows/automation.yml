      - name: Verify an exact stock WRP target through the admitted native SFC
        if: always() && !cancelled()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          if(-not $private -or -not [IO.File]::Exists("$private/source-admitted")){throw 'Require the admitted source'}
          $desktop=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell\v1.0\powershell.exe'
          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tools/round2/server-sfc-verification-native.ps1" -PrivateRoot $private *> "$private/report/sfc-verification.log"
