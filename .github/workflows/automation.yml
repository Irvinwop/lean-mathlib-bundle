        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          try {
            & "$private/source/tools/round2/server-command-security-native.ps1" -PrivateRoot $private *> "$private/report/stage.log"
            exit ([int][IO.File]::ReadAllText("$private/report/exit-code").Trim())
          } catch { $_ | Out-File -LiteralPath "$private/report/stage.log" -Append; exit 2 }
      - name: Independently test file inventory on a disposable temp tree
        if: always() && !cancelled()
        timeout-minutes: 3
        shell: pwsh
        run: |
