          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tests/Test-Round2IisFirewallDynamicTransport.Native.ps1" -Repo "$private/source" *> "$private/report/a028-native.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/a028-native.exit",([string]$code+"`n"))
