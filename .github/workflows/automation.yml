      - name: Test read-only stream, search-path and debugger inventory
        if: always() && !cancelled()
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
