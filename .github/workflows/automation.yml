      - name: Check signed directory owner repair and child preservation
        if: always() && !cancelled()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          if(-not $private -or -not [IO.File]::Exists("$private/source-admitted")){throw 'Require the admitted source'}
          $desktop=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell\v1.0\powershell.exe'
          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tools/round2/server-component-directory-owner-native.ps1" -PrivateRoot $private *> "$private/report/component-directory-owner.log"
