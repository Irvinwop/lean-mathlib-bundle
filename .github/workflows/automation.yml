      - name: Test native browser distrust batching and recovery journals
        if: always() && !cancelled()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          if(-not $private -or -not [IO.File]::Exists("$private/source-admitted")){throw 'Require the admitted source'}
          $desktop=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell/v1.0/powershell.exe'
          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tools/round2/server-browser-distrust-batch-native.ps1" -PrivateRoot $private *> "$private/report/browser-distrust-batch.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/browser-distrust-batch.exit",([string]$code+"`n"))
          exit $code
      - name: Test exact owner and DACL repair on multiple stock Windows files
        if: always() && !cancelled()
        timeout-minutes: 5
        shell: pwsh
        run: |
