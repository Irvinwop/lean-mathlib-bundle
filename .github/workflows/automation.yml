          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tests/Test-WindowsFileInventory.Native.ps1" -RunNative *> "$private/report/inventory-witness.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/inventory-witness.exit",([string]$code+"`n"))
          exit $code
      - name: Verify native event-log identity and reject shared file links
        if: always() && !cancelled()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          if(-not $private -or -not [IO.File]::Exists("$private/source-admitted")){throw 'Require the admitted source'}
          $desktop=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell/v1.0/powershell.exe'
          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tests/Test-MvpAuditChannel.Native.ps1" *> "$private/report/native-audit-channel.log"
          $code=$LASTEXITCODE
          [IO.File]::WriteAllText("$private/report/native-audit-channel.exit",([string]$code+"`n"))
          exit $code
      - name: Verify typed registry repair and no-write repeat under HKCU
        if: always() && !cancelled()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$private=$env:CYPAT_PRIVATE_ROOT
          if(-not $private -or -not [IO.File]::Exists("$private/source-admitted")){throw 'Require the admitted source'}
          $desktop=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell/v1.0/powershell.exe'
          & $desktop -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$private/source/tests/Test-MvpRegistry.Native.ps1" -Repo "$private/source" *> "$private/report/native-registry-match.log"
          $code=$LASTEXITCODE
